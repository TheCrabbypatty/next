{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Next{% endblock %}</title>
    

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"/>
    <link rel="stylesheet" href="{% static 'interface/styles.css' %}">
</head>

<nav class="glass navbar navbar-expand-lg mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'main' %}">Next</a>
      <div class="d-flex">
        <a href="{% url 'login' %}" class="btn me-2">Logout</a>
        <button id="themeToggle" class="btn">🌙 Dark</button>
      </div>
    </div>
  </div>
</nav>


<body>

    <div class="container py-4">
        {% block body %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
  const toggleBtn = document.getElementById("themeToggle");
  const root = document.documentElement;

  // Load saved theme
  if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      toggleBtn.textContent = "☀️ Light";
  }

  toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      if (document.body.classList.contains("dark")) {
          localStorage.setItem("theme", "dark");
          toggleBtn.textContent = "☀️ Light";
      } else {
          localStorage.setItem("theme", "light");
          toggleBtn.textContent = "🌙 Dark";
      }
  });
    </script>

</body>
</html>
