{% extends "interface/layout.html" %}

{% block body %}
<div class="glass" style="max-width: 400px; margin: auto;">
<h2>Login</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <p class="mt-3">
    Don't have an account?
    <a href="{% url 'register' %}">Register here!</a>
    </p>
    <button class="btn btn-primary">Login</button>
</form>
</div>

{% endblock %}
