{% extends "interface/layout.html" %}

{% block body %}
<div class="glass" style="max-width: 400px; margin: auto;">
<h2>Create an Account</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <p class="mt-3">
    Already have an account?
    <a href="{% url 'login' %}">Login here!</a>
    </p>
    <button class="btn btn-success">Register</button>
</form>
</div>

{% endblock %}
