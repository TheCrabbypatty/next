{% extends "interface/layout.html" %}

{% block body %}
<h2>Create an Account</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button class="btn btn-success">Register</button>
</form>

<p class="mt-3">
    Already have an account?
    <a href="{% url 'login' %}">Login</a>
</p>
{% endblock %}
